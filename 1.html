<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center &mdash; Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-card: #1e2130;
            --bg-card-hover: #252840;
            --border-color: #2a2d3e;
            --border-accent: #3b3f54;
            --text-primary: #e8eaf0;
            --text-secondary: #9498ac;
            --text-muted: #6b6f82;
            --accent-blue: #4e8cff;
            --accent-blue-dim: rgba(78,140,255,0.15);
            --accent-green: #34d399;
            --accent-green-dim: rgba(52,211,153,0.12);
            --accent-red: #f87171;
            --accent-red-dim: rgba(248,113,113,0.12);
            --accent-amber: #fbbf24;
            --accent-amber-dim: rgba(251,191,36,0.12);
            --accent-purple: #a78bfa;
            --accent-purple-dim: rgba(167,139,250,0.12);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.15);
            --shadow-card-hover: 0 4px 16px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.2);
            --transition-fast: 150ms ease;
            --transition-med: 250ms ease;
        }
        html { font-size: 14px; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-accent); }
        a { color: inherit; text-decoration: none; }

        .app { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
            transition: transform var(--transition-med);
        }
        .sidebar-header { padding: 20px 22px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
        .sidebar-logo {
            width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent-blue), #7c3aed);
            border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px; color: #fff; flex-shrink: 0;
        }
        .sidebar-brand { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
        .sidebar-brand span { color: var(--text-muted); font-weight: 400; font-size: 12px; display: block; margin-top: 1px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title {
            font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--text-muted); padding: 0 10px; margin-bottom: 6px;
        }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm);
            color: var(--text-secondary); cursor: pointer; transition: all var(--transition-fast);
            font-size: 13px; font-weight: 500; user-select: none;
        }
        .nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
        .nav-item.active { background: var(--accent-blue-dim); color: var(--accent-blue); }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-badge {
            margin-left: auto; background: var(--accent-red); color: #fff; font-size: 10px;
            font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center;
        }
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-color); }
        .user-profile {
            display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm);
            cursor: pointer; transition: background var(--transition-fast);
        }
        .user-profile:hover { background: var(--bg-card); }
        .user-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, var(--accent-blue));
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 13px; color: #fff; flex-shrink: 0;
        }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { font-size: 11px; color: var(--text-muted); }

        /* Main */
        .main { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-height: 100vh; }

        /* Header */
        .header {
            border-bottom: 1px solid var(--border-color); padding: 14px 28px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px);
            background: rgba(26,29,39,0.85);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-toggle { display: none; background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; }
        .menu-toggle svg { width: 22px; height: 22px; }
        .header-title h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
        .header-title p { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .header-btn {
            background: none; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            color: var(--text-secondary); padding: 7px 10px; cursor: pointer;
            transition: all var(--transition-fast); display: flex; align-items: center; gap: 6px; font-size: 12px;
        }
        .header-btn:hover { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-accent); }
        .header-btn svg { width: 16px; height: 16px; }
        .header-btn.primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .header-btn.primary:hover { opacity: 0.9; }
        .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent-green); font-weight: 600; }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-green); animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
            50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(52,211,153,0); }
        }

        /* Content */
        .content { padding: 24px 28px; flex: 1; }

        /* View Panels */
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* Stats Row */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            padding: 20px; transition: all var(--transition-med); cursor: default;
        }
        .stat-card:hover { border-color: var(--border-accent); box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
        .stat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .stat-icon {
            width: 38px; height: 38px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
        }
        .stat-icon svg { width: 20px; height: 20px; }
        .stat-icon.blue { background: var(--accent-blue-dim); color: var(--accent-blue); }
        .stat-icon.green { background: var(--accent-green-dim); color: var(--accent-green); }
        .stat-icon.amber { background: var(--accent-amber-dim); color: var(--accent-amber); }
        .stat-icon.purple { background: var(--accent-purple-dim); color: var(--accent-purple); }
        .stat-change { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
        .stat-change.up { background: var(--accent-green-dim); color: var(--accent-green); }
        .stat-change.down { background: var(--accent-red-dim); color: var(--accent-red); }
        .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 3px; }
        .stat-label { font-size: 12px; color: var(--text-muted); }

        /* Grid Layout */
        .grid-2col { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .grid-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }

        /* Card */
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            overflow: hidden; transition: border-color var(--transition-med);
        }
        .card:hover { border-color: var(--border-accent); }
        .card-header {
            padding: 16px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .card-title svg { width: 16px; height: 16px; color: var(--text-muted); }
        .card-actions { display: flex; gap: 4px; }
        .card-action-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            padding: 4px 8px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 500;
            transition: all var(--transition-fast);
        }
        .card-action-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .card-action-btn.active { color: var(--accent-blue); background: var(--accent-blue-dim); }
        .card-body { padding: 16px 20px; }
        .card-body.no-pad { padding: 0; }

        /* Chart */
        .chart-container { position: relative; height: 220px; padding: 12px 0; }
        canvas { display: block; }
        .stock-summary { display: flex; gap: 24px; padding: 14px 20px; border-top: 1px solid var(--border-color); overflow-x: auto; }
        .stock-item { display: flex; align-items: center; gap: 10px; min-width: fit-content; }
        .stock-symbol { font-size: 12px; font-weight: 700; color: var(--text-primary); }
        .stock-price { font-size: 12px; color: var(--text-secondary); transition: color 0.5s; }
        .stock-delta { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
        .stock-delta.up { background: var(--accent-green-dim); color: var(--accent-green); }
        .stock-delta.down { background: var(--accent-red-dim); color: var(--accent-red); }

        /* News */
        .news-list { list-style: none; }
        .news-item {
            padding: 14px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; gap: 14px; transition: background var(--transition-fast); cursor: pointer;
        }
        .news-item:last-child { border-bottom: none; }
        .news-item:hover { background: var(--bg-card-hover); }
        .news-thumb {
            width: 72px; height: 52px; border-radius: var(--radius-sm); flex-shrink: 0;
            background: var(--bg-primary); display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .news-thumb-inner {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }
        .news-content { flex: 1; min-width: 0; }
        .news-category {
            font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px;
        }
        .news-category.tech { color: var(--accent-blue); }
        .news-category.finance { color: var(--accent-green); }
        .news-category.politics { color: var(--accent-amber); }
        .news-category.health { color: var(--accent-purple); }
        .news-category.world { color: var(--accent-red); }
        .news-headline {
            font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .news-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .news-source { font-weight: 600; color: var(--text-secondary); }

        /* Market Table */
        .market-table { width: 100%; border-collapse: collapse; }
        .market-table th {
            font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--text-muted); padding: 10px 20px; text-align: left; border-bottom: 1px solid var(--border-color);
        }
        .market-table th:last-child { text-align: right; }
        .market-table td { padding: 10px 20px; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .market-table tr:last-child td { border-bottom: none; }
        .market-table tr:hover td { background: var(--bg-card-hover); }
        .market-table .ticker { font-weight: 700; color: var(--text-primary); }
        .market-table .company { color: var(--text-muted); font-size: 11px; }
        .market-table .price { font-weight: 600; }
        .market-table .change { text-align: right; font-weight: 600; font-size: 12px; }
        .market-table .change.up { color: var(--accent-green); }
        .market-table .change.down { color: var(--accent-red); }
        .sparkline { display: inline-flex; align-items: flex-end; gap: 1px; height: 24px; vertical-align: middle; }
        .sparkline-bar { width: 3px; border-radius: 1px; }

        /* Weather */
        .weather-main { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .weather-icon { font-size: 44px; line-height: 1; }
        .weather-temp { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
        .weather-temp span { font-size: 18px; color: var(--text-muted); font-weight: 400; }
        .weather-desc { font-size: 13px; color: var(--text-secondary); }
        .weather-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .weather-detail { display: flex; justify-content: space-between; font-size: 12px; }
        .weather-detail-label { color: var(--text-muted); }
        .weather-detail-value { font-weight: 600; }
        .weather-forecast { display: flex; gap: 0; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color); }
        .forecast-day { flex: 1; text-align: center; font-size: 11px; }
        .forecast-day-name { color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .forecast-day-icon { font-size: 18px; margin-bottom: 4px; }
        .forecast-day-temp { font-weight: 600; font-size: 12px; }
        .forecast-day-low { color: var(--text-muted); }

        /* Crypto */
        .crypto-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .crypto-item:last-child { border-bottom: none; }
        .crypto-icon-wrap {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0;
        }
        .crypto-info { flex: 1; }
        .crypto-name { font-size: 13px; font-weight: 600; }
        .crypto-symbol { font-size: 11px; color: var(--text-muted); }
        .crypto-price-info { text-align: right; }
        .crypto-price { font-size: 13px; font-weight: 600; }
        .crypto-change { font-size: 11px; font-weight: 600; }
        .crypto-change.up { color: var(--accent-green); }
        .crypto-change.down { color: var(--accent-red); }

        /* World Indices */
        .indices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
        .index-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .index-item:nth-child(even) { border-right: none; }
        .index-item:nth-last-child(-n+2) { border-bottom: none; }
        .index-name { font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .index-value { font-size: 15px; font-weight: 700; margin: 2px 0; }
        .index-change { font-size: 11px; font-weight: 600; }
        .index-change.up { color: var(--accent-green); }
        .index-change.down { color: var(--accent-red); }

        /* Calendar */
        .calendar-event { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .calendar-event:last-child { border-bottom: none; }
        .cal-time { font-size: 11px; font-weight: 600; color: var(--text-muted); min-width: 52px; padding-top: 2px; }
        .cal-bar { width: 3px; border-radius: 2px; flex-shrink: 0; }
        .cal-bar.blue { background: var(--accent-blue); }
        .cal-bar.green { background: var(--accent-green); }
        .cal-bar.amber { background: var(--accent-amber); }
        .cal-bar.purple { background: var(--accent-purple); }
        .cal-info { flex: 1; }
        .cal-title { font-size: 13px; font-weight: 600; }
        .cal-desc { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

        /* Activity */
        .activity-list { list-style: none; }
        .activity-item { display: flex; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border-color); }
        .activity-item:last-child { border-bottom: none; }
        .activity-dot-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
        .activity-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .activity-dot.blue { background: var(--accent-blue); }
        .activity-dot.green { background: var(--accent-green); }
        .activity-dot.amber { background: var(--accent-amber); }
        .activity-dot.red { background: var(--accent-red); }
        .activity-dot.purple { background: var(--accent-purple); }
        .activity-line { width: 1px; flex: 1; background: var(--border-color); margin-top: 4px; }
        .activity-content { flex: 1; }
        .activity-text { font-size: 12px; line-height: 1.5; }
        .activity-text strong { font-weight: 600; }
        .activity-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Trending */
        .trending-list { list-style: none; }
        .trending-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 20px;
            border-bottom: 1px solid var(--border-color); transition: background var(--transition-fast); cursor: pointer;
        }
        .trending-item:last-child { border-bottom: none; }
        .trending-item:hover { background: var(--bg-card-hover); }
        .trending-rank { font-size: 12px; font-weight: 700; color: var(--text-muted); width: 20px; text-align: center; }
        .trending-info { flex: 1; }
        .trending-tag { font-size: 13px; font-weight: 600; }
        .trending-count { font-size: 11px; color: var(--text-muted); }
        .trending-spark { display: flex; align-items: center; }

        /* Tabs */
        .tab-pills { display: flex; gap: 2px; background: var(--bg-primary); border-radius: var(--radius-sm); padding: 2px; }
        .tab-pill {
            padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
            color: var(--text-muted); cursor: pointer; transition: all var(--transition-fast); border: none; background: none;
        }
        .tab-pill:hover { color: var(--text-secondary); }
        .tab-pill.active { background: var(--bg-card); color: var(--text-primary); }

        /* Settings Panel */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .setting-group { margin-bottom: 20px; }
        .setting-group h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text-primary); }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); margin-bottom: 8px;
        }
        .setting-label { font-size: 12px; color: var(--text-secondary); }
        .toggle {
            width: 36px; height: 20px; background: var(--border-color); border-radius: 10px;
            position: relative; cursor: pointer; transition: background var(--transition-fast);
        }
        .toggle.on { background: var(--accent-blue); }
        .toggle::after {
            content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%;
            background: #fff; top: 2px; left: 2px; transition: transform var(--transition-fast);
        }
        .toggle.on::after { transform: translateX(16px); }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 12px 20px; font-size: 13px; color: var(--text-primary);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4); z-index: 1000; transform: translateY(100px); opacity: 0;
            transition: all var(--transition-med); display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-icon { color: var(--accent-green); }

        /* Search */
        .search-box {
            display: flex; align-items: center; gap: 8px; background: var(--bg-primary);
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            padding: 6px 12px; margin-right: 8px; transition: border-color var(--transition-fast);
        }
        .search-box:focus-within { border-color: var(--accent-blue); }
        .search-box svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
        .search-box input {
            background: none; border: none; color: var(--text-primary); font-size: 12px;
            outline: none; width: 160px;
        }
        .search-box input::placeholder { color: var(--text-muted); }

        /* Placeholder detail views */
        .detail-view { padding: 32px; text-align: center; }
        .detail-view h2 { font-size: 22px; margin-bottom: 8px; }
        .detail-view p { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
        .detail-view .placeholder-chart {
            height: 300px; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 14px;
        }

        /* Responsive */
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
        @media (max-width: 1200px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .grid-2col { grid-template-columns: 1fr; }

        function switchView(view) {
            currentView = view;
            currentNewsFilter = 'all';
            currentMoversTab = 'gainers';

            $$('.nav-item').forEach(function(n){ n.classList.remove('active'); });
            var navItem = document.querySelector('.nav-item[data-view="'+view+'"]');
            if (navItem) navItem.classList.add('active');

            $('#viewTitle').textContent = viewTitles[view] || 'Dashboard';

            var mc = $('#mainContent');
            switch(view) {
                case 'dashboard': mc.innerHTML = renderDashboard(); break;
                case 'stocks': mc.innerHTML = renderStocksView(); break;
                case 'crypto': mc.innerHTML = renderCryptoView(); break;
                case 'news': mc.innerHTML = renderNewsView(); break;
                case 'social': mc.innerHTML = renderSocialView(); break;
                case 'settings': mc.innerHTML = renderSettingsView(); break;
                case 'analytics': mc.innerHTML = renderDetailView('Analytics', 'Detailed portfolio analytics and performance tracking', 'Portfolio Performance'); break;
                case 'reports': mc.innerHTML = renderDetailView('Reports', 'Generate and download custom reports for your portfolio', 'Monthly Returns'); break;
                case 'forex': mc.innerHTML = renderDetailView('Forex', 'Real-time foreign exchange rates and currency pair tracking', 'EUR/USD'); break;
                default: mc.innerHTML = renderDashboard();
            }

            populateWidgets();
            bindDynamicEvents();

            // Draw detail chart if needed
            if (['analytics','reports','forex'].indexOf(view) !== -1) {
                setTimeout(function(){ drawChart('detailChart', genChart(120)); }, 50);
            }

            // Close mobile sidebar
            $('#sidebar').classList.remove('open');
            $('#sidebarOverlay').classList.remove('open');
        }

        // ===== BIND DYNAMIC EVENTS =====
        function bindDynamicEvents() {
            // News filter
            $$('.news-filter').forEach(function(btn){
                btn.addEventListener('click', function(){
                    $$('.news-filter').forEach(function(b){b.classList.remove('active');});
                    btn.classList.add('active');
                    currentNewsFilter = btn.getAttribute('data-filter');
                    var nl = document.getElementById('newsList');
                    if (nl) nl.innerHTML = buildNewsList(currentNewsFilter);
                });
            });

            // Movers tabs
            $$('.movers-tab').forEach(function(btn){
                btn.addEventListener('click', function(){
                    $$('.movers-tab').forEach(function(b){b.classList.remove('active');});
                    btn.classList.add('active');
                    currentMoversTab = btn.getAttribute('data-movers');
                    var mb = document.getElementById('marketBody');
                    if (mb) mb.innerHTML = buildMoversTable(currentMoversTab);
                });
            });

            // Chart tabs
            $$('.tab-pill[data-range]').forEach(function(btn){
                btn.addEventListener('click', function(){
                    $$('.tab-pill[data-range]').forEach(function(b){b.classList.remove('active');});
                    btn.classList.add('active');
                    chartData = genChart(120);
                    drawChart('mainChart', chartData);
                });
            });

            // Settings toggles
            $$('.toggle').forEach(function(tog){
                tog.addEventListener('click', function(){
                    tog.classList.toggle('on');
                    var setting = tog.getAttribute('data-setting');
                    var state = tog.classList.contains('on') ? 'enabled' : 'disabled';
                    showToast(setting + ' ' + state);
                });
            });
        }

        // ===== SIDEBAR NAV =====
        $$('.nav-item[data-view]').forEach(function(item){
            item.addEventListener('click', function(){
                switchView(item.getAttribute('data-view'));
            });
        });

        // ===== USER PROFILE =====
        $('#userProfile').addEventListener('click', function(){
            switchView('settings');
        });

        // ===== REFRESH =====
        $('#refreshBtn').addEventListener('click', function(){
            var btn = $('#refreshBtn');
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
            setTimeout(function(){
                switchView(currentView);
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                showToast('Dashboard data refreshed');
            }, 500);
        });

        // ===== EXPORT =====
        $('#exportBtn').addEventListener('click', function(){
            var csvRows = ['Category,Item,Value,Change'];
            csvRows.push('Index,S&P 500,6037.08,-0.86%');
            csvRows.push('Index,Dow Jones,44544.63,-0.83%');
            csvRows.push('Index,NASDAQ,19627.44,-0.84%');
            indices.forEach(function(idx){ csvRows.push('Index,'+idx.name+','+idx.value+','+idx.change); });
            stockData.forEach(function(s){ csvRows.push('Stock,'+s.sym+' - '+s.name+','+s.price+','+(s.change>=0?'+':'')+s.change+'%'); });
            gainers.forEach(function(g){ csvRows.push('Gainer,'+g.ticker+' - '+g.company+','+g.price+',+'+g.change+'%'); });
            losers.forEach(function(l){ csvRows.push('Loser,'+l.ticker+' - '+l.company+','+l.price+','+l.change+'%'); });
            cryptos.forEach(function(c){ csvRows.push('Crypto,'+c.name+' ('+c.sym+')'+(c.price>=1?','+c.price.toFixed(2):',$'+c.price.toFixed(4))+','+(c.up?'+':'')+c.change+'%'); });
            sectors.forEach(function(s){ csvRows.push('Sector,'+s.name+','+(s.up?'+':'')+s.change.toFixed(2)+'%,'); });
            newsItems.forEach(function(n){ csvRows.push('News,'+n.headline.replace(/,/g,';')+','+n.source+','+n.url); });

            var blob = new Blob([csvRows.join('\n')], {type:'text/csv'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'dashboard-export-'+new Date().toISOString().slice(0,10)+'.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Dashboard data exported as CSV');
        });

        // ===== SEARCH =====
        $('#searchInput').addEventListener('input', function(){
            var q = this.value.toLowerCase().trim();
            if (!q) { switchView(currentView); return; }
            // Search across news
            var filtered = newsItems.filter(function(n){ return n.headline.toLowerCase().indexOf(q) !== -1 || n.catLabel.toLowerCase().indexOf(q) !== -1 || n.source.toLowerCase().indexOf(q) !== -1; });
            var stockFiltered = stockData.filter(function(s){ return s.sym.toLowerCase().indexOf(q) !== -1 || s.name.toLowerCase().indexOf(q) !== -1; });
            var cryptoFiltered = cryptos.filter(function(c){ return c.sym.toLowerCase().indexOf(q) !== -1 || c.name.toLowerCase().indexOf(q) !== -1; });

            var h = '<div class="view-panel active fade-in"><h2 style="margin-bottom:16px;font-size:16px">Search results for "'+q.replace(/</g,'&lt;')+'"</h2>';

            if (stockFiltered.length > 0) {
                h += '<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-title">Stocks ('+stockFiltered.length+')</div></div><div class="card-body no-pad"><table class="market-table"><thead><tr><th>Symbol</th><th>Price</th><th>Change</th></tr></thead><tbody>';
                stockFiltered.forEach(function(s){ h += '<tr><td><div class="ticker">'+s.sym+'</div><div class="company">'+s.name+'</div></td><td class="price">'+fmtC(s.price)+'</td><td class="change '+(s.change>=0?'up':'down')+'">'+(s.change>=0?'+':'')+s.change.toFixed(2)+'%</td></tr>'; });
                h += '</tbody></table></div></div>';
            }

            if (cryptoFiltered.length > 0) {
                h += '<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-title">Crypto ('+cryptoFiltered.length+')</div></div><div class="card-body">';
                cryptoFiltered.forEach(function(c){
                    h += '<div class="crypto-item"><div class="crypto-icon-wrap" style="background:'+c.color+'20;color:'+c.color+'">'+c.letter+'</div><div class="crypto-info"><div class="crypto-name">'+c.name+'</div><div class="crypto-symbol">'+c.sym+'</div></div><div class="crypto-price-info"><div class="crypto-price">'+(c.price>=1?fmtC(c.price):'$'+c.price.toFixed(4))+'</div><div class="crypto-change '+(c.up?'up':'down')+'">'+(c.up?'+':'')+c.change.toFixed(2)+'%</div></div></div>';
                });
                h += '</div></div>';
            }

            if (filtered.length > 0) {
                h += '<div class="card"><div class="card-header"><div class="card-title">News ('+filtered.length+')</div></div><div class="card-body no-pad"><ul class="news-list">';
                filtered.forEach(function(n){ h += '<li class="news-item" onclick="window.open(\''+n.url+'\',\'_blank\')"><div class="news-thumb"><div class="news-thumb-inner" style="background:'+n.color+'15;color:'+n.color+'">'+n.catLabel.substring(0,3).toUpperCase()+'</div></div><div class="news-content"><div class="news-category '+n.cat+'">'+n.catLabel+'</div><div class="news-headline">'+n.headline+'</div><div class="news-meta"><span class="news-source">'+n.source+'</span> &middot; '+timeAgo(n.time)+' &middot; <span style="color:var(--accent-blue)">Read &rarr;</span></div></div></li>'; });
                h += '</ul></div></div>';
            }

            if (stockFiltered.length === 0 && cryptoFiltered.length === 0 && filtered.length === 0) {
                h += '<div style="text-align:center;padding:40px;color:var(--text-muted)">No results found for "'+q.replace(/</g,'&lt;')+'"</div>';
            }

            h += '</div>';
            $('#mainContent').innerHTML = h;
        });

        // ===== WINDOW RESIZE =====
        window.addEventListener('resize', function(){
            drawChart('mainChart', chartData);
            drawChart('detailChart', chartData);
        });

        // ===== AUTO REFRESH =====
        setInterval(function(){
            var items = $$('.stock-item');
            if (items.length > 0) {
                var idx = randInt(0, items.length - 1);
                var pe = items[idx].querySelector('.stock-price');
                var de = items[idx].querySelector('.stock-delta');
                if (pe && de) {
                    var op = parseFloat(pe.textContent.replace(/[$,]/g, ''));
                    var np = op + rand(-1.5, 1.5);
                    var nd = rand(-3, 3);
                    pe.textContent = fmtC(np);
                    de.textContent = (nd >= 0 ? '+' : '') + nd.toFixed(2) + '%';
                    de.className = 'stock-delta ' + (nd >= 0 ? 'up' : 'down');
                    pe.style.color = nd >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
                    setTimeout(function(){ pe.style.color = ''; }, 800);
                }
            }
        }, 4000);

        setInterval(function(){
            if (chartData.length > 0) {
                chartData.shift();
                chartData.push(chartData[chartData.length-1] + rand(-12, 13));
                drawChart('mainChart', chartData);
            }
        }, 5000);

        // ===== INIT =====
        switchView('dashboard');

    })();
    </script>
</body>
</html>
